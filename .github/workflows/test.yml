name: Test on PR
on:
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  test:
    name: Run tests (Gradle + Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # reuse 컨테이너는 Ryuk 관리 밖 — JVM 스톨 시 테스트 도중 컨테이너가 회수되는 문제 방지
      - name: Enable Testcontainers reuse
        run: echo "testcontainers.reuse.enable=true" >> ~/.testcontainers.properties

      - name: Run tests
        run: ./gradlew test --no-daemon
