name: Deploy Prod (build → ECR → EC2)
on:
  push:
    branches: [prod]
  workflow_dispatch: # 수동 트리거 (UI에서 "Run workflow" 버튼)

permissions:
  id-token: write # OIDC token 발급 (모든 job에서 사용)
  contents: read  # repo checkout

jobs:
  build-and-push:
    name: Build ARM64 image and push to ECR (prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot jar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714933490245:role/lingring-github-actions-prod
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          REGISTRY="714933490245.dkr.ecr.ap-northeast-2.amazonaws.com/lingring/backend-prod"
          TAGS="${REGISTRY}:latest,${REGISTRY}:${TIMESTAMP}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to prod EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714933490245:role/lingring-github-actions-prod
          aws-region: ap-northeast-2

      - name: Discover prod EC2 instance ID (tag-based)
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-northeast-2 \
            --filters \
              "Name=tag:Project,Values=lingring" \
              "Name=tag:Environment,Values=prod" \
              "Name=tag:Name,Values=lingring-prod-server" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Send deploy command to prod EC2
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          COMMAND_ID=$(aws ssm send-command \
            --region ap-northeast-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "lingring-deploy-prod" \
            --query 'Command.CommandId' --output text)

          # 5분 polling (5초 × 60)
          for _ in {1..60}; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --region ap-northeast-2 \
              --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            [[ "$STATUS" != Pending && "$STATUS" != InProgress ]] && break
          done

          aws ssm get-command-invocation --region ap-northeast-2 \
            --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output yaml

          [[ "$STATUS" == Success ]]
