spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:lingring}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:lingring}
    password: ${DB_PASSWORD:lingring}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

logging:
  level:
    root: info

auth:
  jwt:
    secret: dev-secret-replace-with-real-256bit-key-min-32-bytes-required
    access-ttl: PT1H
    refresh-ttl: P30D
  kakao:
    iss: https://kauth.kakao.com
    aud: 71d9c43427f1b2f02c9c7f19b3f8bfe7
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
  apple:
    iss: https://appleid.apple.com
    aud: ${APPLE_AUD:com.lingring.app}
    jwks-uri: https://appleid.apple.com/auth/keys
    team-id: 5KY3J7AAJ6
    key-id: DB8QC35MY9
    client-id: ${APPLE_CLIENT_ID:com.lingring.app}
    private-key: |
      -----BEGIN PRIVATE KEY-----
      MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgNe3eZcG7JDEiVP2/
      jLFnR81+Yz24LrS3bHLnb9xOGOugCgYIKoZIzj0DAQehRANCAAT8ZBf8c8OX9hxF
      kOQ00kWg2GivKbXoIYYcSwH/CDMKGJeCJBECpCk5aLnBoOZHutkMVOqE5l3bsOCh
      tF4XoUbS
