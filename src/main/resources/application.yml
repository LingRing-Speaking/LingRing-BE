  demo:
    enabled: ${DEMO_LOGIN_ENABLED:true}
    tokens:
      34a6ff8e3f90fdf174ac113570dd5e97: REVIEWER_A
      f21ad523fe977c03a0f26ed6061734e8: REVIEWER_B
      f21dc46dd76381cf6b6e2ac445049039: REVIEWER_C

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:lingring-dev}
    region: ${AWS_S3_REGION:ap-northeast-2}
    presigned-url-expiration-seconds: 300
  rekognition:
    region: ${AWS_REKOGNITION_REGION:ap-northeast-2}
    min-confidence: 80
    blocked-categories:
      - "Explicit"
      - "Violence"
      - "Visually Disturbing"
      - "Hate Symbols"
      - "Drugs & Tobacco"

profile-image:
  allowed-content-type-prefix: image/
  max-content-length-bytes: 31457280

call-recording:
  allowed-content-types:
    - audio/m4a
    - audio/mp4
    - audio/webm
  max-content-length: 52428800

s3:
  call-recording:
    prefix: call-recordings/
    upload-ttl: PT10M

apple:
  token-encrypt-password: dltjddn423!
  token-encrypt-salt: d3e7642a0750fe97

matching:
  confirm-deadline-seconds: 15
  cooldown-minutes: 10

