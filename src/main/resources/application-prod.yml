spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

logging:
  level:
    root: info
    com.lingring: info

auth:
  jwt:
    access-ttl: PT30M
  demo:
    enabled: true                # App Store/Play Store 심사 리뷰어용. 토큰 노출 주의.
    tokens:
      ${DEMO_TOKEN_A}: REVIEWER_A
      ${DEMO_TOKEN_B}: REVIEWER_B
      ${DEMO_TOKEN_C}: REVIEWER_C

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
