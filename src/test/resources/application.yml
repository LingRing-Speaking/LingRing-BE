spring:
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      sqs:
        listener:
          auto-startup: false   # 통합 테스트에서 리스너 컨테이너가 실제 SQS를 폴링하지 않도록 차단
  jpa:
    hibernate:
      ddl-auto: create
  datasource:
    hikari:
      maximum-pool-size: 3

scheduling:
  enabled: false

firebase:
  # 테스트 전용 더미 서비스 계정(실제 프로젝트 아님). FirebaseApp 초기화용이며 발송은 FakePushSender가 대신한다
  credentials: 

matching:
  confirm-deadline-seconds: 2
  cooldown-minutes: 1
  alive-ttl-seconds: 30

call-invitation:
  invite-ttl-seconds: 30
  result-ttl-seconds: 60

presence:
  ttl-seconds: 10

signaling:
  disconnect-grace-period: 1s

auth:
  jwt:
    secret: test-secret-min-32-bytes-required-for-hs256-signing
    access-ttl: PT1H
    refresh-ttl: P30D
  kakao:
    iss: https://kauth.kakao.com
    aud: test-kakao-native-app-key
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
  apple:
    iss: https://appleid.apple.com
    aud: test-apple-aud
    jwks-uri: https://appleid.apple.com/auth/keys
    team-id: TEST_TEAM_ID
    key-id: TEST_KEY_ID
    client-id: com.lingring.app.test
    private-key: TEST_PRIVATE_KEY_PEM
    token-encrypt-password: test-encrypt-password
    token-encrypt-salt: deadbeefcafebabe
  google:
    iss: https://accounts.google.com,accounts.google.com
    aud: test-google-web-client-id,test-google-ios-client-id
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs

withdrawn-identity:
  hmac-key: test-withdrawn-identity-hmac-key

test-datasource:
  version: "8.4"
  database-name: test_db
  username: test
  password: test

test-redis:
  image: "redis:7-alpine"

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    presigned-url-expiration-seconds: 300
    call-recording:
      prefix: call-recordings/
      upload-ttl: PT10M
  rekognition:
    region: ap-northeast-2
    min-confidence: 80
    blocked-categories:
      - "Explicit"
      - "Violence"
      - "Visually Disturbing"
      - "Hate Symbols"
      - "Drugs & Tobacco"
  lambda:
    region: ap-northeast-2
    call-analysis-function-name: test-call-analysis
  sqs:
    call-analysis-result-queue-url: http://localhost:4566/000000000000/test-call-analysis-result

profile-image:
  allowed-content-type-prefix: image/
  max-content-length-bytes: 5242880

call-recording:
  allowed-content-types:
    - audio/m4a
    - audio/mp4
    - audio/webm
  max-content-length: 52428800
  retention-days: 30